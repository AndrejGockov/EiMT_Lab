services:
  postgres:
    image: postgres:17.3
    restart: always
#    container_name: accommodation-db
    environment:
      POSTGRES_DB: accommodation_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: pwd
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: